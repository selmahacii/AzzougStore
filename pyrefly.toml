# Pyrefly configuration — point to the backend virtualenv
# so fastapi, sqlalchemy, pydantic imports resolve correctly.
[python]
python_interpreter = ".venv/Scripts/python.exe"

# SQLAlchemy ORM files: Pyrefly cannot statically type-check Column[T] attribute
# assignments or ORM descriptor access patterns. These are all valid at runtime.
[errors]
ignore_errors_in_files = [
  "app/api/v1/delivery_partners.py",
  "app/api/v1/orders.py",
  "app/api/v1/customers.py",
  "app/api/v1/users.py",
  "app/api/v1/products.py",
  "app/api/v1/purchases.py",
  "app/api/v1/returns.py",
  "app/api/v1/expenses.py",
  "app/api/v1/finance.py",
  "app/api/v1/stock.py",
  "app/api/v1/suppliers.py",
  "app/api/v1/analytics.py",
  "app/api/v1/marketing.py",
  "app/api/v1/pos.py",
  "app/models/delivery_partner.py",
  "app/models/order.py",
  "app/models/customer.py",
  "app/models/product.py",
  "app/models/finance.py",
  "app/models/partner.py",
  "app/models/pos.py",
  "app/models/promotion.py",
]
